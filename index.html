<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1e293b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Expenses">
  <meta name="description" content="Fast, cross-platform expense tracker for Android, iOS, Windows, and Mac">
  <title>Expense Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="logo-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="20" height="14" x="2" y="5" rx="2"/>
            <line x1="2" x2="22" y1="10" y2="10"/>
          </svg>
        </div>
        <div>
          <h1>Expense Tracker</h1>
          <p class="subtitle">Personal spending dashboard</p>
        </div>
      </div>
      <div class="header-controls">
        <label for="currency-select" class="sr-only">Currency</label>
        <select id="currency-select" aria-label="Select currency">
          <option value="RM">RM (MYR)</option>
          <option value="$" selected>$ (USD)</option>
          <option value="€">€ (EUR)</option>
          <option value="£">£ (GBP)</option>
          <option value="¥">¥ (JPY/CNY)</option>
          <option value="S$">S$ (SGD)</option>
        </select>
      </div>
    </header>

    <!-- Stat Highlights -->
    <section class="metrics-grid">
      <div class="metric-card primary">
        <span class="metric-label">Total Spent</span>
        <div class="metric-value" id="total-spend">0.00</div>
        <span class="metric-sub" id="transaction-count">0 transactions logged</span>
      </div>
      <div class="metric-card">
        <span class="metric-label">Top Category</span>
        <div class="metric-value small" id="top-category">—</div>
        <span class="metric-sub" id="top-category-amount">No expenses yet</span>
      </div>
      <div class="metric-card">
        <span class="metric-label">Latest Activity</span>
        <div class="metric-value small" id="latest-date">—</div>
        <span class="metric-sub" id="latest-note">Ready for your first entry</span>
      </div>
    </section>

    <!-- Main Content Layout -->
    <main class="main-layout">
      <!-- Left Column: Add Transaction Form -->
      <section class="card form-section">
        <div class="card-header">
          <h2>Add Expense</h2>
          <button type="button" id="load-sample-btn" class="btn-text">Load Sample</button>
        </div>
        <form id="expense-form" novalidate>
          <div class="form-group">
            <label for="amount">Amount *</label>
            <div class="input-prefix-wrapper">
              <span class="currency-prefix" id="currency-display">$</span>
              <input 
                type="number" 
                id="amount" 
                name="amount" 
                step="0.01" 
                min="0.01" 
                placeholder="0.00" 
                required 
                inputmode="decimal"
              >
            </div>
            <span class="error-msg" id="amount-error"></span>
          </div>

          <div class="form-group">
            <label for="category">Category *</label>
            <select id="category" name="category" required>
              <option value="" disabled selected>Select category</option>
              <option value="Food & Dining">🍔 Food & Dining</option>
              <option value="Transportation">🚗 Transportation</option>
              <option value="Shopping">🛍️ Shopping</option>
              <option value="Entertainment">🎬 Entertainment</option>
              <option value="Bills & Utilities">⚡ Bills & Utilities</option>
              <option value="Health & Medical">💊 Health & Medical</option>
              <option value="Education">📚 Education</option>
              <option value="Other">📦 Other</option>
            </select>
            <span class="error-msg" id="category-error"></span>
          </div>

          <div class="form-group">
            <label for="date">Date *</label>
            <input type="date" id="date" name="date" required>
            <span class="error-msg" id="date-error"></span>
          </div>

          <div class="form-group">
            <label for="note">Note / Description</label>
            <input 
              type="text" 
              id="note" 
              name="note" 
              placeholder="e.g. Groceries at supermarket" 
              maxlength="100"
            >
          </div>

          <button type="submit" class="btn-primary">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            Save Expense
          </button>
        </form>
      </section>

      <!-- Right Column: Breakdown & History -->
      <section class="dashboard-side">
        <!-- Category Breakdown Card -->
        <div class="card breakdown-card">
          <div class="card-header">
            <h2>Spending by Category</h2>
          </div>
          <div id="category-breakdown-list" class="breakdown-list">
            <p class="empty-state">No categorized expenses recorded yet.</p>
          </div>
        </div>

        <!-- Transaction History Card -->
        <div class="card history-card">
          <div class="card-header">
            <h2>Transaction History</h2>
            <div class="history-actions">
              <label for="filter-category" class="sr-only">Filter by Category</label>
              <select id="filter-category" class="select-filter" aria-label="Filter transactions by category">
                <option value="ALL">All Categories</option>
                <option value="Food & Dining">Food & Dining</option>
                <option value="Transportation">Transportation</option>
                <option value="Shopping">Shopping</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Bills & Utilities">Bills & Utilities</option>
                <option value="Health & Medical">Health & Medical</option>
                <option value="Education">Education</option>
                <option value="Other">Other</option>
              </select>
              <button type="button" id="clear-all-btn" class="btn-danger-text" title="Clear all records">Clear All</button>
            </div>
          </div>
          <div id="transaction-list" class="transaction-list" role="feed" aria-busy="false">
            <!-- Dynamically populated -->
          </div>
        </div>
      </section>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
